# Vuln-app autograder — prove each OWASP vuln is exploitable (and fixable).
# Pure stdlib http.server app + unittest; no external deps.
name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run autograder (6 OWASP checks)
        run: python tests/autograder.py
